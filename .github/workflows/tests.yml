name: Tests

# Runs the screenings pipeline's tests (tests/) on every push and pull
# request that touches the code, the page or its stylesheet: the Python
# tests, plus browser tests of the page's script in headless Chromium.

on:
  push:
    branches: [main]
    paths: ["tool/**", "tests/**", "styles.css", "screenings-nyc.html", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["tool/**", "tests/**", "styles.css", "screenings-nyc.html", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (for the browser tests)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
