name: Daily Screenings (NYC)

# Every morning: stores every screening repertory.nyc lists from today on in
# data/nyc-screenings/ (one JSON Lines file per month), matches them against
# Hesham's Letterboxd watchlist, and rebuilds screenings-nyc.html with this
# week (today through Sunday) plus a picker for later weeks. Commits to main
# so Cloudflare Pages re-deploys.
#
# As of Oct 2026 the feed covers 11 venues: Film Forum, Film at Lincoln
# Center, IFC Center, Metrograph, Quad, BAM Rose Cinemas, Anthology Film
# Archives, Roxy, New Plaza, and both Nitehawks. It does NOT include MoMA,
# Museum of the Moving Image, Japan Society, the Paris Theater or Alamo.
#
# No auth needed — repertory.nyc/api/screenings is a public JSON feed, and the
# Letterboxd watchlist is public, so each run first refreshes
# data/watchlist.csv from it (keeping the last good copy if that fails).

on:
  schedule:
    # Daily at 10:17 UTC (6:17 AM EDT / 5:17 AM EST), so the page has today
    # by breakfast. Off the hour to avoid the top-of-hour Actions backlog.
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-screenings-nyc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stdlib only — no install step needed.

      # Refresh the watchlist so films added on Letterboxd since the last run
      # can match. If Letterboxd is unreachable or returns a suspiciously short
      # list, the script leaves data/watchlist.csv as it was and this step is
      # marked failed without stopping the screenings update.
      - name: Refresh watchlist from Letterboxd
        continue-on-error: true
        run: |
          cd tool && python letterboxd_watchlist.py \
            --user hnawaz \
            --out "../data/watchlist.csv"

      # Fetches today through the feed's horizon into data/nyc-screenings/,
      # then rebuilds the page. If the feed is down, the store and page are
      # left as they were and this step fails.
      - name: Store screenings and rebuild screenings-nyc.html
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          cd tool && python main_nyc.py \
            --watchlist "../data/watchlist.csv" \
            --store "../data/nyc-screenings" \
            --site-page "../screenings-nyc.html" \
            --reference-date "$TODAY" \
            --updated "$TODAY"

      - name: Commit and push if anything changed
        run: |
          git config user.name  "screenings-bot"
          git config user.email "screenings-bot@users.noreply.github.com"
          git add screenings-nyc.html data/watchlist.csv data/nyc-screenings
          if git diff --cached --quiet; then
            echo "Nothing changed — nothing to commit."
            exit 0
          fi
          TODAY=$(TZ=America/New_York date +%F)
          git commit -m "Update NYC screenings (${TODAY})"
          # main may have moved since checkout (another workflow or a manual
          # commit, or a "Re-run jobs" of an old run); replay this commit on
          # top of it rather than failing the push.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying in 10s."
            sleep 10
          done
          exit 1
